server:
  port: 8082
  error:
    include-message: always

spring:
  application:
    name: program-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/plp_db?currentSchema=plp_program}
    username: ${SPRING_DATASOURCE_USERNAME:plp_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:plp_secret_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: plp_program
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    schemas: plp_program
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:plp_redis_2026}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:plp_rabbit}
    password: ${SPRING_RABBITMQ_PASSWORD:plp_rabbit_2026}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

plp:
  iam:
    base-url: ${PLP_IAM_BASE_URL:http://iam-service:8081}
  lending:
    base-url: ${PLP_LENDING_BASE_URL:http://lending-service:8083}
  los-integration:
    api-key: ${PLP_LOS_INTEGRATION_API_KEY:plp-los-integration-dev-key}
  storage:
    local:
      root: ${PLP_STORAGE_LOCAL_ROOT:./uploads/digital-invoices}
    minio:
      # Docker EC2: set PLP_STORAGE_MINIO_ENABLED=true and MINIO_ACCESS_KEY/SECRET (see docker-compose.yml).
      enabled: ${PLP_STORAGE_MINIO_ENABLED:false}
      endpoint: ${PLP_STORAGE_MINIO_ENDPOINT:http://minio:9000}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${PLP_STORAGE_MINIO_BUCKET:plp-invoices}
  dev-reset:
    # Local/docker default true; set PLP_DEV_RESET_ENABLED=false in production.
    enabled: ${PLP_DEV_RESET_ENABLED:true}
