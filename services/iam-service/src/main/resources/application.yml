server:
  port: 8081

spring:
  application:
    name: iam-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/plp_db?currentSchema=plp_iam}
    username: ${SPRING_DATASOURCE_USERNAME:plp_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:plp_secret_2026}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: plp_iam
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  flyway:
    enabled: true
    schemas: plp_iam
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:plp_redis_2026}

jwt:
  secret: PLP-JWT-SECRET-KEY-CHANGE-IN-PRODUCTION-MIN-64-BYTES-LONG-2026!!
  access-token-expiry-ms: 28800000
  refresh-token-expiry-ms: 86400000

# Dev-only: allow POST /api/v1/dev/reset-* when true (always false in production).
plp:
  los-integration:
    api-key: ${PLP_LOS_INTEGRATION_API_KEY:plp-los-integration-dev-key}
    default-user-password: ${PLP_INTEGRATION_DEFAULT_USER_PASSWORD:ChangeMe@PLP2026}
  dev-reset:
    # Local/docker default true; set PLP_DEV_RESET_ENABLED=false in production.
    enabled: ${PLP_DEV_RESET_ENABLED:true}
    preserved-user-emails: ${PLP_DEV_RESET_PRESERVED_USER_EMAILS:admin@plp.com,anchor@testcorp.com,raj@testcorp.com,priya@buyerco.com,admin@credinnov.com,creditmanager@credinnov.com,creditofficer@credinnov.com,creditofficer2@credinnov.com,sales@credinnov.com,accounts@credinnov.com,anchor@credinnov.com,borrower@credinnov.com}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://discovery-service:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
